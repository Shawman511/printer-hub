# Builds both images from this repository. To run published images instead
# (no build), use deploy/docker-compose.yml.
services:
  printer-hub:
    build: .
    image: printer-hub:local
    pull_policy: build # rebuild from the checked-out commit on every deploy
    container_name: printer-hub
    restart: unless-stopped
    labels:
      dockhand.update: "false" # built here, so there is no registry to check
    ports:
      - "${HUB_PORT:-3000}:3000"
    environment:
      SLICER_URL: http://slicer:8080
      TZ: ${TZ:-UTC}
      # Printers are set up in the hub (Settings → Printers). These are only read
      # once, to import printers from installs before v0.11; leave them unset.
      AD5M_HOST: ${AD5M_HOST:-}
      AD5M_SERIAL: ${AD5M_SERIAL:-}
      AD5M_CHECK_CODE: ${AD5M_CHECK_CODE:-}
      KOBRAX_HOST: ${KOBRAX_HOST:-}
    volumes:
      - printer-hub-data:/data

  # OrcaSlicer CLI behind a small HTTP API. Shares /data with the hub so model
  # and G-code files are passed by path. Not exposed outside the stack.
  slicer:
    build:
      context: ./slicer
      args:
        ORCA_VERSION: ${ORCA_VERSION:-2.4.2}
    image: printer-hub-slicer:local
    pull_policy: build
    container_name: printer-hub-slicer
    restart: unless-stopped
    labels:
      dockhand.update: "false" # built here, so there is no registry to check
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - printer-hub-data:/data

volumes:
  printer-hub-data:
