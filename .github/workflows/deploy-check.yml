# Runs the install routes the docs give, on clean machines, using the same
# commands as README.md, docs/installation.md and AGENTS.md. Run by hand after a
# release. The "stranger" job only runs once the repository is public: it has no
# login and fetches everything from the public URLs, like a new user.
name: deploy-check
on:
  push:
    branches: [ci/slicer-build]
    paths: ["deploy/**", "install.sh", "compose.yaml", "AGENTS.md", "docs/installation.md", ".github/workflows/deploy-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  HUB: http://127.0.0.1:3000
  RAW: https://raw.githubusercontent.com/Shawman511/printer-hub/main
jobs:
  stranger:
    runs-on: ubuntu-24.04
    steps:
      - name: Is it public yet?
        id: public
        run: |
          if curl -fsSL -o /dev/null "$RAW/install.sh"; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::The repository is private, so a stranger can't install yet"; fi
      - name: The one-liner, logged out
        if: steps.public.outputs.yes
        run: |
          curl -fsSL "$RAW/install.sh" | sh | tee install.log
          grep -Eq 'Setup code:  [0-9A-Z]{5}-[0-9A-Z]{5}' install.log
          curl -fsS "$HUB/api/health"
          curl -fsS "$HUB/api/auth/me" | jq -e '.setup == true'

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 - needed while the packages are private
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Compose route
        run: |
          mkdir "$RUNNER_TEMP/hub" && cp deploy/docker-compose.yml "$RUNNER_TEMP/hub/"
          cd "$RUNNER_TEMP/hub"
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS "$HUB/api/health" && break; sleep 1; done; echo
      - name: HUB_VOLUME keeps the data of a stack moved from source
        run: |
          cd "$RUNNER_TEMP/hub"
          HUB_VOLUME=my-old-stack_printer-hub-data docker compose config | grep -q 'name: my-old-stack_printer-hub-data'
      - name: Image sizes, for the disk space in the docs
        run: |
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker system df
      - name: The setup code command finds one code, after a restart too
        run: |
          code() { docker logs printer-hub 2>&1 | grep "setup code" | tail -n 1 | grep -Eo '[0-9A-Z]{5}-[0-9A-Z]{5}'; }
          [ "$(code | wc -l)" = 1 ]
          docker restart printer-hub
          for i in $(seq 1 30); do curl -fsS "$HUB/api/health" && break; sleep 1; done; echo
          [ "$(code | wc -l)" = 1 ]
          echo "CODE=$(code)" >> "$GITHUB_ENV"
      - name: The image can draw previews
        run: docker exec printer-hub node -e "require('./slicer/thumbnail.js')"
      - name: AGENTS.md, steps 3 to 7
        run: |
          curl -fsS "$HUB/api/auth/me" | jq -e '.setup == true'
          docker ps --filter name=printer-hub --format '{{.Names}}: {{.Status}}'
          JAR=$(mktemp)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          PASSWORD=$(openssl rand -hex 12)
          curl -fsS -c "$JAR" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$CODE\",\"username\":\"admin\",\"password\":\"$PASSWORD\"}" "$HUB/api/auth/setup" | jq -e '.user.role == "admin"'
          curl -fsS -b "$JAR" "$HUB/api/printer-setup/types" | jq '.[] | {type, help, fields: [.fields[] | {key, required, help}]}'
          for t in moonraker octoprint prusalink flashforge anycubic mock; do
            curl -fsS -b "$JAR" "$HUB/api/printer-setup/types" | jq -e --arg t "$t" 'map(.type) | index($t)'
          done
          BODY='{"type":"mock","name":"Sim"}'
          curl -fsS -b "$JAR" -H 'Content-Type: application/json' -d "$BODY" "$HUB/api/printer-setup/test" | jq -e '.ok == true'
          curl -fsS -b "$JAR" -H 'Content-Type: application/json' -d "$BODY" "$HUB/api/printer-setup" | jq -e '.id == "sim"'
          # A printer nobody can reach fails the test with a reason, and isn't saved.
          curl -fsS -b "$JAR" -H 'Content-Type: application/json' -d '{"type":"moonraker","name":"Gone","host":"127.0.0.1:9"}' "$HUB/api/printer-setup/test" | jq -e '.ok == false and (.error | length > 0)'
          curl -fsS -b "$JAR" -X PATCH -H 'Content-Type: application/json' -d '{"timelapse":false}' "$HUB/api/printer-setup/sim" | jq -e '.timelapse == false'
          curl -fsS -b "$JAR" "$HUB/api/printer-setup/machines" | jq -e 'length > 0' >/dev/null
          for i in $(seq 1 20); do curl -fsS -b "$JAR" "$HUB/api/printers" | jq -e '.[0].online == true' && break; sleep 1; done
          curl -fsS -b "$JAR" "$HUB/api/printers" | jq -e '.[] | {id, name, online, status, error}'
          curl -fsS -b "$JAR" "$HUB/api/printers" | jq -e '.[0].online == true'
          curl -fsS -b "$JAR" "$HUB/api/slicer" | jq -e '.available == true and .step == true'
      - name: Backup, restore, update, uninstall
        run: |
          cd "$RUNNER_TEMP/hub"
          docker run --rm --volumes-from printer-hub -v "$PWD":/backup alpine tar czf /backup/printer-hub-backup.tgz -C /data .
          tar tzf printer-hub-backup.tgz | grep -q printers.json
          docker volume inspect printer-hub-data >/dev/null
          # Lose a printer, then restore it.
          curl -fsS -b "$JAR" -X DELETE "$HUB/api/printer-setup/sim"
          docker compose stop
          docker run --rm --volumes-from printer-hub -v "$PWD":/backup alpine sh -c 'rm -rf /data/* && tar xzf /backup/printer-hub-backup.tgz -C /data'
          docker compose start
          for i in $(seq 1 30); do curl -fsS "$HUB/api/health" && break; sleep 1; done; echo
          curl -fsS -b "$JAR" "$HUB/api/printers" | jq -e '.[0].id == "sim"'
          docker compose pull && docker compose up -d
          for i in $(seq 1 30); do curl -fsS "$HUB/api/health" && break; sleep 1; done; echo
          curl -fsS -b "$JAR" "$HUB/api/printers" | jq -e '.[0].id == "sim"'
          docker compose down
          docker volume inspect printer-hub-data >/dev/null
          docker compose down -v --rmi all
          if docker volume inspect printer-hub-data >/dev/null 2>&1; then echo 'the volume is still there'; exit 1; fi

  docker-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 - needed while the packages are private
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One container, no slicer
        run: |
          docker run -d --name printer-hub --restart unless-stopped -p 3000:3000 -v printer-hub-data:/data ghcr.io/shawman511/printer-hub:latest
          for i in $(seq 1 30); do curl -fsS "$HUB/api/health" && break; sleep 1; done; echo
          docker logs printer-hub 2>&1 | grep "setup code" | tail -n 1 | grep -Eq '[0-9A-Z]{5}-[0-9A-Z]{5}'
          docker rm -f printer-hub
          docker volume rm printer-hub-data

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build from source
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS "$HUB/api/health" && break; sleep 1; done; echo
          docker logs printer-hub 2>&1 | grep "setup code" | tail -n 1 | grep -Eq '[0-9A-Z]{5}-[0-9A-Z]{5}'
          docker system df
          docker volume ls
          curl -fsS "$HUB/api/auth/me" | jq -e '.setup == true'
