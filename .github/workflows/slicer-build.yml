# Builds the slicer image, runs its self-test, and slices a real STEP file
# through its API. Runs when slicer files change on main.
name: slicer-build
on:
  push:
    branches: [main, ci/slicer-build]
    paths: ["slicer/**", ".github/workflows/slicer-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Converter stage
        run: docker build --progress=plain --target step2stl -t step2stl-test slicer
      - name: Full slicer image (runs the slice self-test)
        run: docker build --progress=plain -t slicer-test slicer
      - name: Slice a real STEP file through the HTTP API
        run: |
          mkdir -p data/models && chmod -R 777 data
          curl -fsSL -o data/models/to220.step "https://gitlab.com/kicad/libraries/kicad-packages3D/-/raw/master/Package_TO_SOT_THT.3dshapes/TO-220-3_Vertical.step"
          echo "not a step file" > data/models/broken.step
          docker run -d --name slicer -v "$PWD/data:/data" -p 8080:8080 slicer-test
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done; echo
          curl -sf localhost:8080/health | jq -e '.step == true'
          for m in "Anycubic|Anycubic Kobra X 0.4 nozzle" "Flashforge|Flashforge Adventurer 5M 0.4 Nozzle"; do
            v=${m%%|*}; mc=${m#*|}
            prof=$(curl -sfG localhost:8080/profiles --data-urlencode "vendor=$v" --data-urlencode "machine=$mc")
            body=$(jq -n --arg v "$v" --arg m "$mc" --argjson p "$prof" \
              '{input:"/data/models/to220.step", vendor:$v, machine:$m, process:$p.defaults.process, filament:$p.defaults.filament, copies:2, orient:true, options:{infill:15, supports:"off", walls:2}}')
            res=$(curl -s -X POST localhost:8080/slice -d "$body"); echo "$mc: $res"
            echo "$res" | jq -e '.stats.layers > 10 and .stats.grams > 0 and .copies == 2'
          done
          res=$(curl -s -X POST localhost:8080/slice -d "$(echo "$body" | jq '.input = "/data/models/broken.step"')"); echo "broken: $res"
          echo "$res" | jq -e '.error | test("^Couldn.t convert the STEP file: the file couldn.t be read$")'
          docker logs slicer | tail -5
      - name: A project .3mf slices as the user the container runs as
        run: |
          docker exec slicer node project-fixture.js /data/models/project.3mf
          prof=$(curl -sfG localhost:8080/profiles --data-urlencode "vendor=Anycubic" --data-urlencode "machine=Anycubic Kobra X 0.4 nozzle")
          body=$(jq -n --argjson p "$prof" '{input:"/data/models/project.3mf", vendor:"Anycubic", machine:"Anycubic Kobra X 0.4 nozzle", process:$p.defaults.process, filament:$p.defaults.filament, paintInfo:true}')
          res=$(curl -s -X POST localhost:8080/slice -d "$body"); echo "$res"
          echo "$res" | jq -e '.stats.layers > 10'
      - name: Any printer - profile list, shared filament library, plate choice
        run: |
          curl -sf localhost:8080/machines | jq -e 'length > 50 and (map(.vendor) | index("Custom") != null)'
          cp data/models/to220.step data/models/part.step
          for m in "Custom|MyKlipper 0.4 nozzle" "Voron|Voron 2.4 350 0.4 nozzle" "Prusa|Prusa MK4 0.4 nozzle"; do
            v=${m%%|*}; mc=${m#*|}
            prof=$(curl -sfG localhost:8080/profiles --data-urlencode "vendor=$v" --data-urlencode "machine=$mc")
            echo "$prof" | jq -c '{machine, processes: (.processes|length), filaments: (.filaments|length), defaults}'
            body=$(jq -n --arg v "$v" --arg m "$mc" --argjson p "$prof" \
              '{input:"/data/models/part.step", vendor:$v, machine:$m, process:$p.defaults.process, filament:$p.defaults.filament, orient:true}')
            res=$(curl -s -X POST localhost:8080/slice -d "$body"); echo "$mc: $res"
            # PLA bed at a PLA temperature, not Orca's 45 °C fallback for a plate the filament doesn't cover.
            echo "$res" | jq -e '.stats.layers > 10 and .stats.bedTemp >= 50 and .thumbnail == true'
            # Screen previews in the formats the profile asks for (QOI on Prusa, PNG elsewhere).
            f=data/$(echo "$res" | jq -r .output | sed 's#^/data/##')
            grep -E '^; thumbnail(_QOI)? begin [0-9]+x[0-9]+ [0-9]+$' "$f" | tee /dev/stderr | grep -q .
          done
