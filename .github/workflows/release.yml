# On a version tag (v0.11.0 etc.): run the tests, then build and publish both
# images to GitHub Container Registry as :<version> and :latest.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: npm ci
      - run: npm test

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: printer-hub
            context: .
            platforms: linux/amd64,linux/arm64
          # OrcaSlicer only ships x86-64 Linux builds.
          - name: printer-hub-slicer
            context: slicer
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=Printer Hub: self-hosted dashboard, control and slicing for 3D printers
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The one-line install, end to end, on a clean machine with the images just published.
  installer:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 - needed while the packages are private
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install with install.sh
        run: |
          # Serve this checkout as the "raw" files (the repo may still be private).
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$GITHUB_REF_NAME" ] && version=latest   # manual runs
          export HUB_VERSION=$version PRINTER_HUB_RAW=http://127.0.0.1:8765 PRINTER_HUB_DIR=$RUNNER_TEMP/hub
          sh ./install.sh | tee install.log
          grep -Eq 'Setup code:  [0-9A-Z]{5}-[0-9A-Z]{5}' install.log
          docker inspect --format '{{.Config.Image}}' printer-hub printer-hub-slicer
      - name: First run, add a printer, slicer reachable
        run: |
          base=http://127.0.0.1:3000
          code=$(sed -n 's/.*Setup code:  \([0-9A-Z-]*\).*/\1/p' install.log)
          curl -sf $base/api/auth/me | jq -e '.setup == true'
          curl -sf -c jar -H "Origin: $base" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$code\",\"username\":\"admin\",\"password\":\"ci-$(openssl rand -hex 8)\"}" $base/api/auth/setup | jq -e '.user.role == "admin"'
          curl -sf -b jar -H "Origin: $base" -H 'Content-Type: application/json' \
            -d '{"type":"mock","name":"Test printer"}' $base/api/printer-setup | jq -e '.id == "test-printer"'
          for i in $(seq 1 20); do curl -sf -b jar $base/api/printers | jq -e '.[0].online == true' && break; sleep 1; done
          curl -sf -b jar $base/api/printers | jq -e '.[0].online == true'
          curl -sf -b jar $base/api/slicer | jq -e '.available == true and .step == true'
          curl -sf -b jar $base/api/auth/me | jq -r '.hub.version'
      - name: Re-running the installer updates and keeps the data
        run: |
          export HUB_VERSION=${GITHUB_REF_NAME#v} PRINTER_HUB_RAW=http://127.0.0.1:8765 PRINTER_HUB_DIR=$RUNNER_TEMP/hub
          [ "$HUB_VERSION" = "$GITHUB_REF_NAME" ] && export HUB_VERSION=latest
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 1
          sh ./install.sh | tee again.log
          grep -q 'Sign in with your existing account' again.log
          if grep -q 'Setup code:' again.log; then echo 'printed a stale setup code'; exit 1; fi
          curl -sf http://127.0.0.1:3000/api/auth/me | jq -e '.setup == false'
